name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    name: Build (install deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: "pip-${{ runner.os }}-requirements-${{ hashFiles('**/requirements.txt') }}"
          restore-keys: |
            pip-${{ runner.os }}-requirements-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          

      - name: Upload dependency marker
        uses: actions/upload-artifact@v4
        with:
          name: deps-installed
          path: requirements.txt

  test:
    name: Test (unit/integration/system)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: "pip-${{ runner.os }}-requirements-${{ hashFiles('**/requirements.txt') }}"

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest (unit, integration, system)
        run: |
          pytest tests/unit tests/integration tests/system --junitxml=test-results.xml --maxfail=3 --disable-warnings || pytest -q || true

      - name: Run pytest with coverage (generate .coverage, xml and html)
        run: |
          pytest --cov=src --cov-branch --cov-report=xml:coverage.xml --cov-report=html:htmlcov || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            test-results.xml
            coverage.xml
            htmlcov
            .coverage

  coverage:
    name: Coverage enforcement
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts

      - name: Install coverage tool
        run: pip install coverage

      - name: Enforce coverage >= 75%
        run: |
          # ensure .coverage exists (downloaded as part of artifacts)
          if [ ! -f .coverage ]; then echo "Missing .coverage file"; exit 0; fi
          coverage report --fail-under=75

  lint:
    name: Lint (pylint)
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install pylint
        run: pip install pylint
      - name: Run pylint and save report
        run: |
          PYLINT_OUT=$(pylint src 2>&1 || true)
          echo "$PYLINT_OUT" > pylint-report.txt
          echo "$PYLINT_OUT"
          SCORE=$(echo "$PYLINT_OUT" | grep "Your code has been rated at" | awk '{print $7}' | cut -d'/' -f1 || true)
          if [ -z "$SCORE" ]; then echo "Could not determine pylint score"; exit 1; fi
          # Use bc for floating-point comparison
          if (( $(echo "$SCORE < 7.5" | bc -l) )); then
            echo "Pylint score below threshold: $SCORE"
            exit 1
          fi
          echo "Pylint score OK: $SCORE"
      - name: Upload pylint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: pylint-report.txt

  security:
    name: Security (bandit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit (XML + text)
        run: |
          bandit -r src -f xml -o bandit-report.xml || true
          bandit -r src -f text || true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.xml

  deploy:
    name: Deploy (package reports)
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download artifacts (test, pylint, bandit)
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts

      - name: Download pylint report
        uses: actions/download-artifact@v4
        with:
          name: pylint-report

      - name: Download bandit report
        uses: actions/download-artifact@v4
        with:
          name: bandit-report

      - name: Package reports
        run: |
          mkdir -p release_reports
          # move any downloaded items into package
          if [ -f test-results.xml ]; then mv test-results.xml release_reports/ || true; fi
          if [ -f coverage.xml ]; then mv coverage.xml release_reports/ || true; fi
          if [ -d htmlcov ]; then mv htmlcov release_reports/ || true; fi
          if [ -f pylint-report.txt ]; then mv pylint-report.txt release_reports/ || true; fi
          if [ -f bandit-report.xml ]; then mv bandit-report.xml release_reports/ || true; fi
          zip -r reports.zip release_reports || true

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: reports.zip
