<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Modern login illustration with laptop, books, and checklist -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#20c997;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0dcaf0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circles -->
  <circle cx="650" cy="100" r="120" fill="url(#grad1)" opacity="0.12"/>
  <circle cx="150" cy="450" r="100" fill="url(#grad2)" opacity="0.12"/>
  
  <!-- Laptop -->
  <rect x="200" y="200" width="400" height="260" rx="12" fill="#2d3748" stroke="#4a5568" stroke-width="3"/>
  <rect x="210" y="210" width="380" height="220" rx="4" fill="#1a202c"/>
  
  <!-- Screen content - attendance grid -->
  <rect x="240" y="240" width="60" height="8" rx="2" fill="#48bb78"/>
  <rect x="240" y="260" width="80" height="8" rx="2" fill="#4299e1"/>
  <rect x="240" y="280" width="70" height="8" rx="2" fill="#48bb78"/>
  <rect x="240" y="300" width="90" height="8" rx="2" fill="#f56565"/>
  
  <rect x="360" y="240" width="60" height="8" rx="2" fill="#48bb78"/>
  <rect x="360" y="260" width="80" height="8" rx="2" fill="#48bb78"/>
  <rect x="360" y="280" width="70" height="8" rx="2" fill="#4299e1"/>
  <rect x="360" y="300" width="90" height="8" rx="2" fill="#48bb78"/>
  
  <!-- Checkmarks -->
  <circle cx="500" cy="244" r="12" fill="#48bb78"/>
  <path d="M496 244 L499 247 L504 240" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <circle cx="500" cy="284" r="12" fill="#48bb78"/>
  <path d="M496 284 L499 287 L504 280" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Keyboard -->
  <rect x="250" y="430" width="300" height="20" rx="8" fill="#4a5568"/>
  <rect x="260" y="435" width="25" height="8" rx="2" fill="#2d3748"/>
  <rect x="290" y="435" width="25" height="8" rx="2" fill="#2d3748"/>
  <rect x="320" y="435" width="25" height="8" rx="2" fill="#2d3748"/>
  <rect x="350" y="435" width="60" height="8" rx="2" fill="#0d6efd"/>
  <rect x="415" y="435" width="25" height="8" rx="2" fill="#2d3748"/>
  <rect x="445" y="435" width="25" height="8" rx="2" fill="#2d3748"/>
  <rect x="475" y="435" width="60" height="8" rx="2" fill="#2d3748"/>
  
  <!-- Floating book stack -->
  <g transform="translate(80, 280)">
    <rect x="0" y="30" width="80" height="12" rx="2" fill="#4299e1" transform="rotate(-5 40 36)"/>
    <rect x="0" y="18" width="80" height="12" rx="2" fill="#48bb78" transform="rotate(-3 40 24)"/>
    <rect x="0" y="6" width="80" height="12" rx="2" fill="#ed8936"/>
  </g>
  
  <!-- Floating clipboard with checklist -->
  <g transform="translate(640, 300)">
    <rect x="0" y="0" width="100" height="140" rx="8" fill="white" stroke="#cbd5e0" stroke-width="2"/>
    <rect x="35" y="-5" width="30" height="12" rx="4" fill="#a0aec0"/>
    <circle cx="15" cy="30" r="6" fill="#48bb78"/>
    <path d="M12 30 L14 32 L18 27" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <rect x="28" y="27" width="60" height="4" rx="2" fill="#e2e8f0"/>
    
    <circle cx="15" cy="50" r="6" fill="#48bb78"/>
    <path d="M12 50 L14 52 L18 47" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <rect x="28" y="47" width="50" height="4" rx="2" fill="#e2e8f0"/>
    
    <circle cx="15" cy="70" r="6" stroke="#cbd5e0" stroke-width="2" fill="none"/>
    <rect x="28" y="67" width="55" height="4" rx="2" fill="#e2e8f0"/>
    
    <circle cx="15" cy="90" r="6" stroke="#cbd5e0" stroke-width="2" fill="none"/>
    <rect x="28" y="87" width="48" height="4" rx="2" fill="#e2e8f0"/>
  </g>
</svg>
