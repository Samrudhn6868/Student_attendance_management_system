name: CI Pipeline Complete

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: "3.8"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build verification (example: compile check or pre-commit)
      run: |
        echo "Build stage complete, no compilation errors."

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: "3.8"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest tests --junitxml=test-results.xml --maxfail=3 --disable-warnings

    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: test-results.xml

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: "3.8"

    - name: Install coverage tools
      run: pip install coverage

    - name: Run coverage
      run: |
        coverage run -m pytest
        coverage report -m
        coverage html

    - name: Upload coverage html artifact
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: htmlcov

    - name: Enforce coverage threshold
      run: |
        coverage_percent=$(coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')
        if (( $(echo "$coverage_percent < 75" | bc -l) )); then
          echo "Code coverage below threshold."
          exit 1
        fi

  lint:
    runs-on: ubuntu-latest
    needs: coverage
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: "3.8"

    - name: Install pylint
      run: pip install pylint

    - name: Run pylint static analysis
      run: |
        pylint src > pylint-report.txt || true
        pylint_score=$(pylint src | grep "Your code has been rated at" | cut -d " " -f 7 | cut -d "/" -f 1)
        echo "Pylint score: $pylint_score"
        if (( $(echo "$pylint_score < 7.5" | bc -l) )); then
          echo "Pylint score under threshold."
          exit 1
        fi

    - name: Upload pylint report
      uses: actions/upload-artifact@v3
      with:
        name: pylint-report
        path: pylint-report.txt

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: "3.8"

    - name: Install bandit
      run: pip install bandit

    - name: Run Bandit security scan
      run: |
        bandit -r src -f xml -o bandit-report.xml
        bandit -r src -f text || true

    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: bandit-report
        path: bandit-report.xml

    - name: Fail on critical vulnerabilities
      run: |
        crit_vulns=$(grep "<issue severity=\"CRITICAL\"" bandit-report.xml | wc -l)
        if [ "$crit_vulns" -gt 0 ]; then
          echo "Critical vulnerabilities found."
          exit 1
        fi
