<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="shape1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="shape2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#20c997;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#0dcaf0;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="shape3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#0dcaf0;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  
  <!-- Abstract geometric shapes -->
  <circle cx="450" cy="100" r="80" fill="url(#shape1)" opacity="0.25">
    <animate attributeName="cy" values="100;120;100" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <ellipse cx="150" cy="280" rx="100" ry="70" fill="url(#shape2)" opacity="0.25" transform="rotate(45 150 280)">
    <animateTransform attributeName="transform" type="rotate" from="45 150 280" to="405 150 280" dur="20s" repeatCount="indefinite"/>
  </ellipse>
  
  <rect x="300" y="200" width="120" height="120" rx="20" fill="url(#shape3)" opacity="0.2" transform="rotate(30 360 260)">
    <animateTransform attributeName="transform" type="rotate" from="30 360 260" to="390 360 260" dur="15s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Dashboard elements -->
  <g opacity="0.4">
    <!-- Chart bars -->
    <rect x="50" y="120" width="30" height="60" rx="4" fill="#0d6efd"/>
    <rect x="90" y="90" width="30" height="90" rx="4" fill="#20c997"/>
    <rect x="130" y="110" width="30" height="70" rx="4" fill="#4a90e2"/>
    <rect x="170" y="70" width="30" height="110" rx="4" fill="#0dcaf0"/>
    
    <!-- Pie chart suggestion -->
    <circle cx="480" cy="320" r="50" stroke="#0d6efd" stroke-width="8" fill="none" stroke-dasharray="157 314" transform="rotate(-90 480 320)"/>
    <circle cx="480" cy="320" r="50" stroke="#20c997" stroke-width="8" fill="none" stroke-dasharray="78 314" stroke-dashoffset="-157" transform="rotate(-90 480 320)"/>
    <circle cx="480" cy="320" r="50" stroke="#4a90e2" stroke-width="8" fill="none" stroke-dasharray="79 314" stroke-dashoffset="-235" transform="rotate(-90 480 320)"/>
  </g>
</svg>
