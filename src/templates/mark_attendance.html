<h2>Mark Attendance for {{ today }}</h2>
<form method="post">
  <table>
    <tr>
      <th>Student Name</th>
      <th>Absent?</th>
    </tr>
    {% for student in students %}
    <tr>
      <td>{{ student.name }}</td>
      <td>
        <input type="checkbox" name="absentees" value="{{ student.id }}">
      </td>
    </tr>
    {% endfor %}
  </table>
  <button type="submit">Submit Attendance</button>
</form>
